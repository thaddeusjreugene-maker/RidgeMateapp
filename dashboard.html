<style>
:root{--bg:#F4F5F8;--card:#FFFFFF;--sunk:#EEF0F4;--ink:#0E1524;--ink2:#4A556C;--muted:#7A859B;--line:#E3E6EC;--accent:#2F6BFF;--accent-ink:#1E4FD6;--accent-bg:#EAF0FF;
  --ok:#11845B;--ok-bg:#E4F5EC;--warn:#B4580A;--warn-bg:#FFF2E2;--bad:#C93636;--bad-bg:#FDECEC;--shadow:0 1px 2px rgba(14,21,36,.05),0 4px 16px rgba(14,21,36,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--card:#161B24;--sunk:#1E2430;--ink:#EEF1F6;--ink2:#B6BECD;--muted:#8792A6;--line:#2A3140;--accent:#5B8BFF;--accent-ink:#8DAEFF;--accent-bg:#1C2A4A;
  --ok:#4CC38A;--ok-bg:#15322A;--warn:#F2A35A;--warn-bg:#3A2A17;--bad:#F07B7B;--bad-bg:#3A1C1F;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:26px;font-weight:700}h2{font-size:16px;font-weight:650}h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)}.sm{font-size:12.5px}.grow{flex:1}.num{text-align:right;font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.brand b{display:block;font-size:14.5px;line-height:1.2}.brand span{font-size:12px;color:var(--muted)}
.logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:var(--sunk);flex:none}.logo.dot{background:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.side{overflow:hidden}.side-foot{flex:none}
